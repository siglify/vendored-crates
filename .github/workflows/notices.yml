# Apache 2.0 section 4(b): every file Siglify changed says so.
name: notices
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the check reads Herdr's commit in the history
      - run: python3 scripts/check-notices.py
